<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klondike Solitaire</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <h1 class="game-title">Klondike Solitaire</h1>
    <div class="stats">
      <span class="stat">Moves: <span id="move-counter">0</span></span>
      <span class="stat">Score: <span id="score-counter">0</span></span>
      <span class="stat">Time: <span id="timer-display">00:00</span></span>
    </div>
    <div class="actions">
      <button id="btn-draw-mode" type="button" title="Toggle Draw 1 / Draw 3">Draw: 1</button>
      <button id="btn-hint" type="button">Hint</button>
      <button id="btn-auto-complete" type="button" class="hidden">Auto-Complete</button>
      <button id="btn-near-win" type="button" title="Load a deterministic near-win deal to test Auto-Complete">Near-Win Deal</button>
      <button id="btn-stats" type="button">Stats</button>
      <button id="btn-undo" type="button" disabled>Undo</button>
      <button id="btn-new-game" type="button">New Game</button>
    </div>
  </header>

  <main id="game-board">
    <div class="top-row">
      <div id="stock-pile" class="pile-slot" title="Stock"></div>
      <div id="waste-pile" class="pile-slot" title="Waste"></div>
      <div class="top-spacer"></div>
      <div id="foundation-spades" class="pile-slot foundation-slot" data-suit="spades" title="Spades">&spades;</div>
      <div id="foundation-hearts" class="pile-slot foundation-slot" data-suit="hearts" title="Hearts">&hearts;</div>
      <div id="foundation-diamonds" class="pile-slot foundation-slot" data-suit="diamonds" title="Diamonds">&diams;</div>
      <div id="foundation-clubs" class="pile-slot foundation-slot" data-suit="clubs" title="Clubs">&clubs;</div>
    </div>

    <section id="tableau">
      <div id="tableau-0" class="tableau-col" data-col="0"></div>
      <div id="tableau-1" class="tableau-col" data-col="1"></div>
      <div id="tableau-2" class="tableau-col" data-col="2"></div>
      <div id="tableau-3" class="tableau-col" data-col="3"></div>
      <div id="tableau-4" class="tableau-col" data-col="4"></div>
      <div id="tableau-5" class="tableau-col" data-col="5"></div>
      <div id="tableau-6" class="tableau-col" data-col="6"></div>
    </section>
  </main>

  <div id="win-overlay" class="win-overlay hidden">
    <div class="win-card">
      <h2>You Win!</h2>
      <p id="win-stats"></p>
      <button id="btn-play-again" type="button">Play Again</button>
    </div>
  </div>

  <div id="stats-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Statistics</h2>
      <div class="stats-grid">
        <span class="stats-label">Games Played</span><span id="stat-games-played">0</span>
        <span class="stats-label">Games Won</span><span id="stat-games-won">0</span>
        <span class="stats-label">Win Percentage</span><span id="stat-win-pct">0%</span>
        <span class="stats-label">Current Streak</span><span id="stat-current-streak">0</span>
        <span class="stats-label">Best Streak</span><span id="stat-best-streak">0</span>
        <span class="stats-label">Best Time</span><span id="stat-best-time">--:--</span>
      </div>
      <div class="modal-actions">
        <button id="btn-reset-stats" type="button">Reset Stats</button>
        <button id="btn-close-stats" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
